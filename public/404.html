<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hafezon</title>
    <script>
      // GitHub Pages SPA redirect: capture the path and redirect to index.html
      // with the path encoded as a query param so the app can restore it.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/hafezon/' +
        '?p=/' + l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
</html>
